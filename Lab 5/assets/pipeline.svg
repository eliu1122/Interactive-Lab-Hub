<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#556"/>
    </marker>
  </defs>
  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Desk Curfew: works-like pipeline</text>

  <!-- row labels -->
  <text x="20" y="96" font-size="12" font-weight="bold" fill="#778">NIGHT</text>
  <text x="20" y="276" font-size="12" font-weight="bold" fill="#778">MORNING</text>

  <!-- night row -->
  <rect x="80" y="60" width="150" height="70" rx="8" fill="#eef1fb" stroke="#99a"/>
  <text x="155" y="88" text-anchor="middle" font-size="14" font-weight="bold">Webcam</text>
  <text x="155" y="108" text-anchor="middle" font-size="12" fill="#444">one look / 10 s</text>

  <rect x="270" y="60" width="150" height="70" rx="8" fill="#eef1fb" stroke="#99a"/>
  <text x="345" y="88" text-anchor="middle" font-size="14" font-weight="bold">YOLO26n</text>
  <text x="345" y="108" text-anchor="middle" font-size="12" fill="#444">people only (NCNN)</text>

  <rect x="460" y="60" width="180" height="70" rx="8" fill="#eef1fb" stroke="#99a"/>
  <text x="550" y="88" text-anchor="middle" font-size="14" font-weight="bold">interpret()</text>
  <text x="550" y="108" text-anchor="middle" font-size="11" fill="#444">"1 person(s) at center/close"</text>

  <rect x="680" y="60" width="190" height="70" rx="8" fill="#fff6e0" stroke="#cb9"/>
  <text x="775" y="88" text-anchor="middle" font-size="14" font-weight="bold">night_log.jsonl</text>
  <text x="775" y="108" text-anchor="middle" font-size="11" fill="#444">changes + heartbeat / 10 min</text>

  <rect x="910" y="60" width="170" height="70" rx="8" fill="#fff6e0" stroke="#cb9"/>
  <text x="995" y="88" text-anchor="middle" font-size="14" font-weight="bold">tonight.json</text>
  <text x="995" y="108" text-anchor="middle" font-size="11" fill="#444">curfew + start time</text>

  <line x1="230" y1="95" x2="266" y2="95" stroke="#556" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="95" x2="456" y2="95" stroke="#556" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="95" x2="676" y2="95" stroke="#556" stroke-width="2" marker-end="url(#a)"/>
  <text x="985" y="160" text-anchor="end" font-size="11" fill="#666">set with the PiTFT buttons at bedtime</text>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#666">overnight.py (Part H), started by curfew.py</text>

  <!-- morning row -->
  <rect x="680" y="220" width="190" height="90" rx="8" fill="#eaf6ea" stroke="#3c8d40"/>
  <text x="775" y="246" text-anchor="middle" font-size="14" font-weight="bold">night_report.py</text>
  <text x="775" y="266" text-anchor="middle" font-size="11" fill="#333">code, not the LLM: left at,</text>
  <text x="775" y="282" text-anchor="middle" font-size="11" fill="#333">returns, minutes late,</text>
  <text x="775" y="298" text-anchor="middle" font-size="11" fill="#333">glimpses, blind spots</text>
  <line x1="775" y1="130" x2="775" y2="216" stroke="#556" stroke-width="2" marker-end="url(#a)"/>
  <path d="M995,130 L995,265 L874,265" fill="none" stroke="#556" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="210" width="200" height="50" rx="8" fill="#eef1fb" stroke="#99a"/>
  <text x="530" y="232" text-anchor="middle" font-size="13" font-weight="bold">PiTFT: green / red</text>
  <text x="530" y="250" text-anchor="middle" font-size="11" fill="#444">verdict straight from the code</text>
  <line x1="680" y1="245" x2="634" y2="238" stroke="#556" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="290" width="200" height="60" rx="8" fill="#f6eefb" stroke="#97a"/>
  <text x="530" y="314" text-anchor="middle" font-size="13" font-weight="bold">Qwen 3.5 0.8b</text>
  <text x="530" y="332" text-anchor="middle" font-size="11" fill="#444">rewords the checked sentences</text>
  <line x1="680" y1="290" x2="634" y2="312" stroke="#556" stroke-width="2" marker-end="url(#a)"/>

  <rect x="220" y="290" width="170" height="60" rx="8" fill="#fde8e6" stroke="#c0392b"/>
  <text x="305" y="314" text-anchor="middle" font-size="13" font-weight="bold">time check</text>
  <text x="305" y="332" text-anchor="middle" font-size="11" fill="#444">any time changed → template</text>
  <line x1="430" y1="320" x2="394" y2="320" stroke="#556" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="290" width="140" height="60" rx="8" fill="#eef1fb" stroke="#99a"/>
  <text x="110" y="314" text-anchor="middle" font-size="13" font-weight="bold">PiTFT message</text>
  <text x="110" y="332" text-anchor="middle" font-size="11" fill="#444">a page per top press</text>
  <line x1="220" y1="320" x2="184" y2="320" stroke="#556" stroke-width="2" marker-end="url(#a)"/>

  <text x="550" y="384" text-anchor="middle" font-size="11" fill="#888">Everything runs on the Raspberry Pi 5; snapshots stay in snaps/ (git-ignored) and are deleted after the demo.</text>
</svg>
