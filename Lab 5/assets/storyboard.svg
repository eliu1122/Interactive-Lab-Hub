<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Desk Curfew: storyboard</text>

  <defs>
    <!-- desk and device box, shared by all three panels (panel-local coordinates) -->
    <g id="desk">
      <rect x="150" y="200" width="200" height="10" fill="#8b6a4a"/>
      <rect x="160" y="210" width="8" height="80" fill="#8b6a4a"/>
      <rect x="332" y="210" width="8" height="80" fill="#8b6a4a"/>
      <rect x="276" y="162" width="56" height="38" rx="4" fill="#3a3a3a"/>
      <circle cx="283" cy="192" r="4" fill="#9ad"/>
      <line x1="326" y1="162" x2="326" y2="104" stroke="#555" stroke-width="3"/>
    </g>
    <g id="chair">
      <rect x="100" y="222" width="52" height="7" fill="#556"/>
      <rect x="100" y="160" width="7" height="69" fill="#556"/>
      <rect x="104" y="229" width="5" height="61" fill="#556"/>
      <rect x="143" y="229" width="5" height="61" fill="#556"/>
    </g>
  </defs>

  <!-- Panel 1: before bed -->
  <g transform="translate(20,56)">
    <rect width="370" height="330" rx="10" fill="#e9ecf5" stroke="#99a" />
    <text x="14" y="26" font-size="16" font-weight="bold" fill="#223">1. Before bed · 23:10</text>
    <line x1="0" y1="290" x2="370" y2="290" stroke="#99a"/>
    <use href="#chair"/>
    <use href="#desk"/>
    <rect x="282" y="168" width="40" height="18" fill="#bfe3ff"/>
    <text x="302" y="181" font-size="9" text-anchor="middle" fill="#123">00:30</text>
    <rect x="327" y="130" width="24" height="14" fill="#e8a33a"/>
    <text x="320" y="141" font-size="10" text-anchor="end" fill="#555">half-mast</text>
    <!-- person seated, waving at the camera -->
    <circle cx="136" cy="134" r="14" fill="#f2c9a0" stroke="#333"/>
    <line x1="136" y1="148" x2="136" y2="218" stroke="#333" stroke-width="4"/>
    <line x1="136" y1="166" x2="172" y2="112" stroke="#333" stroke-width="4"/>
    <circle cx="174" cy="108" r="5" fill="#f2c9a0" stroke="#333"/>
    <path d="M158,118 Q152,108 158,98" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M150,122 Q142,108 150,94" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="283" y1="192" x2="182" y2="112" stroke="#6a8fb5" stroke-dasharray="4 4"/>
    <line x1="136" y1="218" x2="178" y2="220" stroke="#333" stroke-width="4"/>
    <line x1="178" y1="220" x2="178" y2="288" stroke="#333" stroke-width="4"/>
    <rect x="160" y="44" width="196" height="50" rx="10" fill="#fff" stroke="#333"/>
    <polygon points="300,94 312,94 300,112" fill="#fff" stroke="#333"/>
    <text x="172" y="64" font-size="13" fill="#222">"Curfew 12:30 a.m.</text>
    <text x="172" y="82" font-size="13" fill="#222">Goodnight." (then dark)</text>
    <text x="14" y="312" font-size="12" fill="#333">A wave at the camera hands over tonight's curfew.</text>
  </g>

  <!-- Panel 2: while asleep -->
  <g transform="translate(415,56)">
    <rect width="370" height="330" rx="10" fill="#1f2540" stroke="#445" />
    <text x="14" y="26" font-size="16" font-weight="bold" fill="#e6e9ff">2. While asleep · 00:30–07:00</text>
    <circle cx="44" cy="62" r="16" fill="#f4f1c9"/>
    <circle cx="52" cy="56" r="14" fill="#1f2540"/>
    <line x1="0" y1="290" x2="370" y2="290" stroke="#556"/>
    <polygon points="283,192 96,150 96,290 200,290" fill="#9ad" opacity="0.18"/>
    <line x1="283" y1="192" x2="96" y2="150" stroke="#9ad" stroke-dasharray="5 4"/>
    <line x1="283" y1="192" x2="200" y2="290" stroke="#9ad" stroke-dasharray="5 4"/>
    <use href="#chair"/>
    <use href="#desk"/>
    <rect x="282" y="168" width="40" height="18" fill="#111"/>
    <rect x="327" y="130" width="24" height="14" fill="#e8a33a"/>
    <rect x="0" y="246" width="40" height="44" fill="#4a5070"/>
    <text x="4" y="240" font-size="10" fill="#aab">bed: out</text>
    <text x="4" y="252" font-size="10" fill="#aab">of frame</text>
    <rect x="150" y="42" width="206" height="78" rx="6" fill="#0d1022" stroke="#556"/>
    <text x="160" y="60" font-size="11" font-family="Menlo, monospace" fill="#9fe39f">00:51 nobody</text>
    <text x="160" y="76" font-size="11" font-family="Menlo, monospace" fill="#9fe39f">01:00 alive</text>
    <text x="160" y="92" font-size="11" font-family="Menlo, monospace" fill="#9fe39f">03:10 1 person(s)</text>
    <text x="160" y="108" font-size="11" font-family="Menlo, monospace" fill="#9fe39f">03:14 nobody</text>
    <text x="14" y="312" font-size="12" fill="#dde">One look every 10 s at the chair; only changes are logged.</text>
  </g>

  <!-- Panel 3: when awake -->
  <g transform="translate(810,56)">
    <rect width="370" height="330" rx="10" fill="#fff4dd" stroke="#cb9" />
    <text x="14" y="26" font-size="16" font-weight="bold" fill="#432">3. When awake · 07:00</text>
    <circle cx="44" cy="62" r="14" fill="#f5b83d"/>
    <line x1="0" y1="290" x2="370" y2="290" stroke="#cb9"/>
    <use href="#chair"/>
    <use href="#desk"/>
    <rect x="282" y="168" width="40" height="18" fill="#bfe3ff"/>
    <text x="302" y="181" font-size="8" text-anchor="middle" fill="#123">MISSED</text>
    <rect x="327" y="148" width="24" height="14" fill="#c0392b"/>
    <text x="331" y="176" font-size="10" fill="#555">down</text>
    <!-- person standing with a mug, waving for a replay -->
    <circle cx="226" cy="108" r="14" fill="#f2c9a0" stroke="#333"/>
    <line x1="226" y1="122" x2="226" y2="214" stroke="#333" stroke-width="4"/>
    <line x1="226" y1="140" x2="196" y2="98" stroke="#333" stroke-width="4"/>
    <path d="M186,112 Q180,103 186,94" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="226" y1="140" x2="252" y2="166" stroke="#333" stroke-width="4"/>
    <rect x="250" y="158" width="14" height="16" fill="#fff" stroke="#333"/>
    <line x1="226" y1="214" x2="214" y2="288" stroke="#333" stroke-width="4"/>
    <line x1="226" y1="214" x2="240" y2="288" stroke="#333" stroke-width="4"/>
    <rect x="70" y="40" width="290" height="50" rx="10" fill="#fff" stroke="#333"/>
    <polygon points="256,90 268,90 284,162" fill="#fff" stroke="#333"/>
    <text x="80" y="60" font-size="12" fill="#222">"Curfew missed: 26 min after 00:30.</text>
    <text x="80" y="78" font-size="12" fill="#222">You left at 00:51, back once at 03:10."</text>
    <text x="14" y="312" font-size="12" fill="#333">Flag answers at a glance; the voice says why, a wave replays it.</text>
  </g>

  <text x="600" y="420" text-anchor="middle" font-size="13" fill="#444">The flag has three positions: half-mast while watching, up if the chair stayed empty after curfew, down if not.</text>
  <text x="600" y="442" text-anchor="middle" font-size="13" fill="#444">Times are worked out in code (night_report.py); Qwen only rewords them, and its answer is rejected if a time changes.</text>
  <text x="600" y="476" text-anchor="middle" font-size="11" fill="#888">Drafted as an SVG with AI assistance (Claude); see the AI disclosure in the README.</text>
</svg>
